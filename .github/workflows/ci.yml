name: ci

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        pcap: [with-libpcap, without-libpcap]
        opt: [-O2, "-O1 -g -fsanitize=address,undefined"]

    steps:
      - uses: actions/checkout@v4

      - name: install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y build-essential libpcap-dev python3 tcpdump iputils-ping
          if [ "${{ matrix.pcap }}" = "without-libpcap" ]; then
            sudo apt-get remove -y libpcap-dev libpcap0.8-dev || true
          fi

      - name: build
        run: |
          make clean
          make -j"$(nproc)" OPT="${{ matrix.opt }}" LDFLAGS="${{ contains(matrix.opt,'sanitize') && '-fsanitize=address,undefined' || '' }}"

      - name: unit tests
        run: make test OPT="${{ matrix.opt }}"

      - name: end-to-end tests
        run: sudo -E env "PATH=$PATH" bash tests/e2e.sh
        if: matrix.opt == '-O2'

      - name: version and capabilities
        run: ./bin/pktsniff-server --version
